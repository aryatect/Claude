name: AI Daily Newsletter

on:
  schedule:
    - cron: "0 9 * * *" # 09:00 UTC daily; edit to change send time
  workflow_dispatch:

permissions:
  contents: write # commits newsletter/state/seen.json

concurrency: ai-newsletter

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r newsletter/requirements.txt
      - name: Tests
        run: python -m pytest -q newsletter
      - name: Research and send
        working-directory: newsletter
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          NEWSLETTER_RECIPIENTS: ${{ secrets.NEWSLETTER_RECIPIENTS || 'abhinav17@gmail.com' }}
        run: python newsletter.py
      - name: Save sent-buzzword state
        run: |
          git config user.name "newsletter-bot"
          git config user.email "newsletter-bot@users.noreply.github.com"
          git add newsletter/state/seen.json
          git diff --cached --quiet || (git commit -m "Update sent buzzword list" && git push)
